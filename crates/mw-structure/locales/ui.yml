dialog:
  cancel:
    en: Cancel
    zh-CN: 取消
  delete:
    en: Delete
    zh-CN: 删除
  delete_site:
    title:
      en: "Delete %{label}?"
      zh-CN: "删除 %{label}？"
    description:
      en: You can undo this.
      zh-CN: 删除后可以撤销。
  delete_atom:
    title:
      en: "Which atoms of %{label} should be deleted?"
      zh-CN: "删除 %{label} 的哪些原子？"
    description:
      en: "The structure is in symmetry mode (%{symbol}), and %{label} has %{count} equivalent atoms in the cell. Deleting the site removes all %{count}; deleting only the selected atom needs the structure converted to P1 first. Both can be undone."
      zh-CN: "当前结构处于对称模式（%{symbol}），%{label} 在晶胞内有 %{count} 个等效原子。删除位点会同时删掉这 %{count} 个；只删除选中的这一个，需要先把结构转为 P1。两种操作都可以撤销。"
    operations:
      en: "%{count} operations"
      zh-CN: "%{count} 个对称操作"
    all:
      en: "Delete all %{count}"
      zh-CN: "删除全部 %{count} 个"
    one:
      en: Convert to P1 and delete this one
      zh-CN: 转为 P1 后删除这一个
  convert:
    title:
      en: Convert to P1?
      zh-CN: 转为 P1？
    description:
      en: "The %{sites} sites expand to %{atoms} atoms, each edited on its own. You can undo this, or detect the symmetry again later."
      zh-CN: "%{sites} 个位点会展开为 %{atoms} 个原子，之后每个原子都可以单独编辑。可以撤销，也可以之后重新检测对称性。"
    ok:
      en: Convert to P1
      zh-CN: 转为 P1
    already_p1:
      en: This structure is already in P1 mode.
      zh-CN: 这个结构已经是 P1 模式。
  supercell:
    title:
      en: Make supercell
      zh-CN: 生成超胞
    description:
      en: "Creates a new structure from %{name}, repeated 2 × 2 × 2. The original stays unchanged."
      zh-CN: "由「%{name}」按 2 × 2 × 2 重复生成一个新结构，原结构保持不变。"
    ok:
      en: Make supercell
      zh-CN: 生成超胞
