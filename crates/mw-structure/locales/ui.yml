      zh-CN: "%{symbol}（%{number} 号）"
    space_group_number:
      en: "No. %{number}"
      zh-CN: "%{number} 号"
    space_group_unknown:
      en: Not identified
      zh-CN: 无法识别
    setting:
      en: Setting
      zh-CN: 设定
    setting_value:
      en: "%{symbol} (%{code})"
      zh-CN: "%{symbol}（%{code}）"
    setting_transformed:
      en: Not tabulated
      zh-CN: 非表列设定
    transformed_hint:
      en: The operations use a cell or origin the International Tables do not list. Wyckoff positions refer to the standard setting.
      zh-CN: 对称操作所用的晶胞或原点不在《国际晶体学表》所列的设定中，Wyckoff 位置按标准设定给出。
    detected:
      en: Atom symmetry
      zh-CN: 原子对称性
    detected_hint:
      en: The atoms have higher symmetry than P1. Symmetrize to edit in symmetry mode.
      zh-CN: 原子排布的对称性高于 P1，对称化后可以在对称模式下编辑。
    operations:
      en: Operations
      zh-CN: 对称操作
    operation_count:
      en: "%{count}"
      zh-CN: "%{count} 个"
    mode:
      en: Editing
      zh-CN: 编辑模式
    mode_symmetric:
      en: Keep symmetry
      zh-CN: 保持对称
    mode_p1:
      en: P1, atoms edited one by one
      zh-CN: P1，逐个原子编辑
    convert_to_p1:
      en: Convert to P1…
      zh-CN: 转为 P1…
    symmetrize:
      en: Symmetrize…
      zh-CN: 对称化…
  site:
    none:
      en: Select a site in the 3D view or the Sites tab.
      zh-CN: 在视口或"位点"标签页中选择一个位点。
    title:
      en: "Selected site %{label}"
      zh-CN: "选中位点 %{label}"
    atoms:
      en: "%{count} atoms per cell"
      zh-CN: "晶胞内 %{count} 个原子"
    wyckoff:
      en: "Wyckoff %{wyckoff} · site symmetry %{symmetry} · %{form}"
      zh-CN: "Wyckoff %{wyckoff} · 位点对称性 %{symmetry} · %{form}"
    form:
      en: "Coordinates %{form}"
      zh-CN: "坐标形式 %{form}"
    element:
      en: Element
      zh-CN: 元素
    occupancy:
      en: Occupancy
      zh-CN: 占位率
    add_occupant:
      en: Add mixed occupant…
      zh-CN: 添加混合占位…
  sites:
    title:
      en: Asymmetric unit
      zh-CN: 不对称单元
    count:
      en: "%{count} sites"
      zh-CN: "%{count} 个位点"
    add:
      en: Add site…
      zh-CN: 添加位点…
    row:
      en: "%{element} · %{wyckoff} · %{count} atoms"
      zh-CN: "%{element} · %{wyckoff} · %{count} 个原子"
    row_without_wyckoff:
      en: "%{element} · %{count} atoms"
      zh-CN: "%{element} · %{count} 个原子"
    symmetric_hint:
      en: In symmetry mode, editing a site changes all of its equivalent atoms.
      zh-CN: 对称模式下，编辑一个位点会同时改变它的全部等效原子。
  measurements:
    empty:
      en: No measurements yet.
      zh-CN: 还没有测量。
    hint:
      en: Turn on Measure and click two atoms for their distance, then a third for the angle at the second. Click empty space to start over.
      zh-CN: 打开"测量"后，依次点选 2 个原子得到距离，再点第 3 个得到以第 2 个原子为顶点的键角。点空白处重新开始。
    stale:
      en: Stale
      zh-CN: 已失效
    remove:
      en: Remove measurement
      zh-CN: 删除测量
  diagnostics:
    empty:
      en: No diagnostics.
      zh-CN: 没有诊断信息。
