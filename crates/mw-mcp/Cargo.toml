[package]
name = "mw-mcp"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
mw-automation.workspace = true
mw-crystal.workspace = true
mw-crystal-io.workspace = true
mw-project-file.workspace = true
rmcp = { workspace = true, features = ["server", "transport-io", "elicitation"] }
tokio = { workspace = true, features = ["io-std", "io-util", "net"] }
serde.workspace = true
# Random tokens for the channel to the running application.
uuid.workspace = true
serde_json.workspace = true
# Images in tool results (view.snapshot) are base64 text.
base64 = "0.22"
log.workspace = true
env_logger.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
dirs.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
# The integration tests drive the server binary as an MCP client would.
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
# Only to check that every tool schema is in the strict subset
# (docs/design/ai-integration.md §6.2.6).
mw-llm.workspace = true
