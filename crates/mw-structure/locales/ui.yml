      en: "Selected site %{label}"
      zh-CN: "选中位点 %{label}"
    atoms:
      en: "%{count} atoms per cell"
      zh-CN: "晶胞内 %{count} 个原子"
    wyckoff:
      en: "Wyckoff %{wyckoff} · coordinates %{form}"
