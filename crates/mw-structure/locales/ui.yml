      en: Add site…
      zh-CN: 添加位点…
    row:
      en: "%{element} · %{wyckoff} · %{count} atoms"
      zh-CN: "%{element} · %{wyckoff} · %{count} 个原子"
    symmetric_hint:
      en: In symmetry mode, editing a site changes all of its equivalent atoms.
      zh-CN: 对称模式下，编辑一个位点会同时改变它的全部等效原子。
  measurements:
    empty:
      en: No measurements yet.
      zh-CN: 还没有测量。
    hint:
      en: Turn on Measure, then pick two atoms for a distance or three for an angle.
      zh-CN: 打开"测量"后，依次点选 2 个原子得到距离，点选 3 个得到键角。
  diagnostics:
    empty:
      en: No diagnostics.
      zh-CN: 没有诊断信息。
