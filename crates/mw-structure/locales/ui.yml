mock:
  not_implemented:
    en: "%{feature} is not implemented yet."
    zh-CN: "「%{feature}」尚未实现。"
  diagnostic:
    snapped:
      en: "On import, %{site} was snapped to special position %{wyckoff} (largest shift %{shift} Å)."
      zh-CN: "导入时 %{site} 吸附到特殊位置 %{wyckoff}（最大位移 %{shift} Å）。"
    supercell:
      en: This supercell is in P1. Symmetry detection is not implemented yet, so editing applies to single atoms.
      zh-CN: 这个超胞处于 P1 模式。对称性检测尚未实现，编辑只作用于单个原子。
