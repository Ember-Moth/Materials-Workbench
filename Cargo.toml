[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
mw-automation = { path = "crates/mw-automation" }
mw-crystal = { path = "crates/mw-crystal" }
mw-crystal-io = { path = "crates/mw-crystal-io" }
mw-crystal-render = { path = "crates/mw-crystal-render" }
mw-project = { path = "crates/mw-project" }
mw-project-file = { path = "crates/mw-project-file" }
mw-structure = { path = "crates/mw-structure" }
mw-viewport = { path = "crates/mw-viewport" }
gpui-kit = "0.8.0"
# Same major version as GPUI's own wgpu renderer (gpui-pre-wgpu 0.3.9),
# see docs/design/viewport-rendering.md §5.2.
wgpu = "29"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.30", features = ["bytemuck"] }
pollster = "0.4"
log = "0.4"
env_logger = "0.11"
rust-i18n = "4.2"
# Space group tables, Wyckoff positions and symmetry search, see
# docs/design/crystallography-model.md §11. 0.x: pinned to the minor version.
moyo = "0.21"
nalgebra = "0.35"

# Model provider clients for the built-in assistant (mw-llm), see
# docs/design/ai-integration.md §6.2. HTTP runs on a dedicated tokio runtime
# thread; callers poll the returned futures streams on any executor.
mw-llm = { path = "crates/mw-llm" }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "stream", "system-proxy"] }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
futures = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive"] }
# Exact float parsing: project files must read back every f64 bit for bit
# (docs/design/project-format.md §6).
serde_json = { version = "1", features = ["float_roundtrip"] }

# Project files (docs/design/project-format.md): entry ids, content hashes of
# imported files, and the system's configuration directory.
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
dirs = "6"
tempfile = "3"

# GPUI and the component library are slow in unoptimized builds; this follows
# the GPUI Kit installation guide. The symmetry search is optimized too, so
# that tests and debug builds analyze structures quickly.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
wgpu = { opt-level = 3 }
wgpu-core = { opt-level = 3 }
wgpu-hal = { opt-level = 3 }
naga = { opt-level = 3 }
moyo = { opt-level = 3 }
nalgebra = { opt-level = 3 }
